<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm booking | RailYatra</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <div class="brand">
      <span class="brand-mark">RY</span>
      <span>RailYatra</span>
    </div>

    <div class="nav-user">
      <span class="pill" id="userPill"></span>
      <button class="btn btn-outline" id="dashboardBtn">My bookings</button>
      <button class="btn btn-outline" id="logoutBtn">Log out</button>
    </div>
  </div>
</nav>

<div class="container section">
  <div class="card booking-shell" id="detailsView">
    <div class="form-error" id="errorBox"></div>

    <div id="trainSummary"></div>

    <form id="bookingForm">
      <div class="field">
        <label for="passengerName">Passenger name</label>
        <input type="text" id="passengerName" placeholder="Enter passenger name" required>
      </div>

      <div class="field">
        <label for="seatCount">Number of seats</label>
        <input type="number" id="seatCount" min="1" max="6" value="1" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Confirm booking
      </button>
    </form>
  </div>

  <div class="card booking-shell" id="successView" style="display:none;">
    <div class="status-banner" id="statusBanner">
      <h2 id="statusHeading"></h2>
      <p id="statusText"></p>
    </div>

    <div id="bookingSummary"></div>

    <div style="margin-top: 20px; display: flex; gap: 12px;">
      <a href="dashboard.html" class="btn btn-primary btn-block">
        View my bookings
      </a>

      <a href="home.html" class="btn btn-ghost btn-block">
        Book another trip
      </a>
    </div>
  </div>
</div>

<footer>
  RailYatra &middot; A DSA-powered train booking demonstration
</footer>

<script src="js/session.js"></script>
<script src="js/api.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
