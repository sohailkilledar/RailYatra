<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | RailYatra</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="card auth-card">
    <div class="brand">
      <span class="brand-mark">RY</span>
      <span>RailYatra</span>
    </div>

    <p class="auth-subtitle">Log in to manage your bookings</p>

    <div class="form-error" id="errorBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Log in
      </button>
    </form>

    <div class="divider">or</div>

    <button class="btn btn-ghost btn-block" id="guestBtn">
      Continue as guest
    </button>

    <div class="auth-footer">
      New here? <a href="register.html">Create an account</a>
    </div>
  </div>
</div>

<script src="js/session.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById('guestBtn').addEventListener('click', () => {
    startGuestSession();
    window.location.href = 'home.html';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    errorBox.classList.remove('visible');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const user = await apiPost('/auth/login', { email, password });
      setSession({ ...user, isGuest: false });
      window.location.href = 'home.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('visible');
    }
  });

  if (getSession()) {
    window.location.href = 'home.html';
  }
</script>
</body>
</html>
